name: W03a Windows measurements

# Measurements 1, 3, 4 and 7 from issue #57 ("Measure before W03a"), on
# hosted runners. Runs on a push to a measure/** branch; not part of CI.
# The core: scripts/install.ps1 installs the newest release (so uv's receipt
# names the index), then the wheel built from EvoScientist main goes into the
# tool environment with `uv pip install --reinstall-package`, as Test-Update in
# the core's .github/scripts/install_smoke_check.ps1 does. Installing the
# wheel through install.ps1 instead would record a `path` source in the
# receipt, and every `EvoSci update` would then refuse with manual_update.
# The results are records in the artifacts; the jobs do not fail on them.
on:
  push:
    branches: ["measure/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: main
  UPDATE_VERSION: "0.3.7"

jobs:
  core-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: EvoScientist/EvoScientist
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build the wheel and export the constraints
        working-directory: core
        run: |
          uv build --wheel -o ../dist
          uv export --frozen --no-hashes --no-dev --no-emit-project --all-extras --no-header --no-annotate --quiet -o ../dist/constraints.txt
          cp scripts/install.ps1 ../dist/
          git rev-parse HEAD > ../dist/core-sha.txt
          cat ../dist/core-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/

  # Measurement 1: console windows of every descendant of an Electron main
  # process (setup, deploy, taskkill, update and its helper).
  consoles:
    needs: core-wheel
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: ${{ runner.temp }}/dist
      - name: Install Electron for the probe app
        working-directory: desktop-measure
        # Electron 44 has no postinstall: the binary comes from its
        # install-electron bin (or lazily on the first require).
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx --no install-electron
      - name: Install the core (release by the script, then main's wheel over it), no setup
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw "$env:RUNNER_TEMP\dist\install.ps1"))) -NoSetup -NoModifyPath
          $dataDir = Join-Path $env:USERPROFILE '.evoscientist'
          $uv = (Get-Content -Raw -Encoding UTF8 (Join-Path $dataDir 'tools\uv.json') | ConvertFrom-Json).path
          $python = Join-Path ((& $uv tool dir | Select-Object -Last 1).Trim()) 'evoscientist\Scripts\python.exe'
          $evosci = Join-Path ((& $uv tool dir --bin | Select-Object -Last 1).Trim()) 'EvoSci.exe'
          # uv splits a -c path at spaces (astral-sh/uv#12639): by name, from its folder.
          Push-Location "$env:RUNNER_TEMP\dist"
          & $uv pip install -q --python $python --reinstall-package evoscientist -c constraints.txt (Get-ChildItem *.whl).FullName
          if ($LASTEXITCODE -ne 0) { throw "uv pip install of main's wheel failed" }
          Pop-Location
          # main's code is in place: only it has `deploy --json` (C13).
          $help = (& $evosci deploy --help) -join "`n"
          if ($help -notmatch '--json') { throw "EvoSci deploy has no --json: main's wheel is not in place" }
          "core sha: $(Get-Content "$env:RUNNER_TEMP\dist\core-sha.txt")"
      - name: Measure
        shell: powershell
        run: |
          $electron = Join-Path $env:GITHUB_WORKSPACE 'desktop-measure\node_modules\electron\dist\electron.exe'
          if (-not (Test-Path -LiteralPath $electron)) { throw "No Electron at $electron" }
          $dataDir = Join-Path $env:USERPROFILE '.evoscientist'
          $uv = (Get-Content -Raw -Encoding UTF8 (Join-Path $dataDir 'tools\uv.json') | ConvertFrom-Json).path
          $env:EVOSCI = Join-Path ((& $uv tool dir --bin | Select-Object -Last 1).Trim()) 'EvoSci.exe'
          $env:MEASURE_OUT = "$env:RUNNER_TEMP\measure-out"
          $env:WORKDIR = "$env:RUNNER_TEMP\workspace"
          # Only system folders on PATH, so setup downloads Node, uv's Python and Git.
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0\;$env:SystemRoot\System32\Wbem"
          Get-ChildItem Env: | Where-Object Name -match '^(UV_|PIP_|PYTHONPATH$)' | ForEach-Object { Remove-Item "Env:\$($_.Name)" }
          $p = Start-Process -FilePath $electron -ArgumentList "`"$env:GITHUB_WORKSPACE\desktop-measure`"", '--mode=consoles' -PassThru -Wait
          Write-Host "probe exit code: $($p.ExitCode)"
          Get-Content "$env:MEASURE_OUT\consoles.result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-1-consoles
          path: ${{ runner.temp }}/measure-out/

  # Measurement 3: a UI server left behind after the main process is killed.
  orphan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Electron for the probe app
        working-directory: desktop-measure
        # Electron 44 has no postinstall: the binary comes from its
        # install-electron bin (or lazily on the first require).
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx --no install-electron
      - name: Measure
        shell: powershell
        run: |
          $electron = Join-Path $env:GITHUB_WORKSPACE 'desktop-measure\node_modules\electron\dist\electron.exe'
          if (-not (Test-Path -LiteralPath $electron)) { throw "No Electron at $electron" }
          $env:MEASURE_OUT = "$env:RUNNER_TEMP\measure-out"
          foreach ($variant in 'running', 'suspended') {
            & "$env:GITHUB_WORKSPACE\desktop-measure\orphan_check.ps1" -Variant $variant -Electron $electron
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-3-orphan
          path: ${{ runner.temp }}/measure-out/

  # Measurement 4, from a parent that reads only stdout and (control) one
  # that reads both streams: a stand-in that writes 1 MiB to stderr, then
  # EvoSci update --json with a cold uv cache.
  backpressure:
    needs: core-wheel
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        read: [stdout, both]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: ${{ runner.temp }}/dist
      - name: Install Electron for the probe app
        working-directory: desktop-measure
        # Electron 44 has no postinstall: the binary comes from its
        # install-electron bin (or lazily on the first require).
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx --no install-electron
      - name: Install the core (release by the script, then main's wheel over it), no setup
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw "$env:RUNNER_TEMP\dist\install.ps1"))) -NoSetup -NoModifyPath
          $dataDir = Join-Path $env:USERPROFILE '.evoscientist'
          $uv = (Get-Content -Raw -Encoding UTF8 (Join-Path $dataDir 'tools\uv.json') | ConvertFrom-Json).path
          $python = Join-Path ((& $uv tool dir | Select-Object -Last 1).Trim()) 'evoscientist\Scripts\python.exe'
          $evosci = Join-Path ((& $uv tool dir --bin | Select-Object -Last 1).Trim()) 'EvoSci.exe'
          # uv splits a -c path at spaces (astral-sh/uv#12639): by name, from its folder.
          Push-Location "$env:RUNNER_TEMP\dist"
          & $uv pip install -q --python $python --reinstall-package evoscientist -c constraints.txt (Get-ChildItem *.whl).FullName
          if ($LASTEXITCODE -ne 0) { throw "uv pip install of main's wheel failed" }
          Pop-Location
          # main's code is in place: only it has `deploy --json` (C13).
          $help = (& $evosci deploy --help) -join "`n"
          if ($help -notmatch '--json') { throw "EvoSci deploy has no --json: main's wheel is not in place" }
          "core sha: $(Get-Content "$env:RUNNER_TEMP\dist\core-sha.txt")"
      - name: Measure
        shell: powershell
        env:
          READ: ${{ matrix.read }}
        run: |
          $electron = Join-Path $env:GITHUB_WORKSPACE 'desktop-measure\node_modules\electron\dist\electron.exe'
          if (-not (Test-Path -LiteralPath $electron)) { throw "No Electron at $electron" }
          $dataDir = Join-Path $env:USERPROFILE '.evoscientist'
          $uv = (Get-Content -Raw -Encoding UTF8 (Join-Path $dataDir 'tools\uv.json') | ConvertFrom-Json).path
          $env:EVOSCI = Join-Path ((& $uv tool dir --bin | Select-Object -Last 1).Trim()) 'EvoSci.exe'
          $env:MEASURE_OUT = "$env:RUNNER_TEMP\measure-out"
          $env:WORKDIR = "$env:RUNNER_TEMP\workspace"
          New-Item -ItemType Directory -Force -Path $env:MEASURE_OUT, $env:WORKDIR | Out-Null
          # The same restricted environment as consoles, from setup on, so the
          # setup that the update runs afterwards finds what this one installed.
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0\;$env:SystemRoot\System32\Wbem"
          Get-ChildItem Env: | Where-Object Name -match '^(UV_|PIP_|PYTHONPATH$)' | ForEach-Object { Remove-Item "Env:\$($_.Name)" }
          # Start-Process redirects stderr without turning its lines into
          # PowerShell errors, which the runner's $ErrorActionPreference = 'Stop' would throw on.
          $s = Start-Process -FilePath $env:EVOSCI -ArgumentList 'setup', '--json' -WorkingDirectory $env:WORKDIR -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "$env:MEASURE_OUT\setup-before.jsonl" -RedirectStandardError "$env:MEASURE_OUT\setup-before.stderr.log"
          Write-Host "setup before the measurement: exit $($s.ExitCode)"
          # A cold uv cache, so the reinstall prints all of uv's download output.
          & $uv cache clean
          # The pipe alone first (a stand-in writing 1 MiB to stderr), then EvoSci update.
          foreach ($m in 'pipefill', 'backpressure') {
            $p = Start-Process -FilePath $electron -ArgumentList "`"$env:GITHUB_WORKSPACE\desktop-measure`"", "--mode=$m" -PassThru -Wait
            Write-Host "$m probe exit code: $($p.ExitCode)"
            Get-Content "$env:MEASURE_OUT\$m.result.json"
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-4-backpressure-${{ matrix.read }}
          path: ${{ runner.temp }}/measure-out/

  # Measurement 7: an x64 Node on Windows on Arm.
  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
      - name: Measure
        run: node desktop-measure/arm64_check.cjs
