name: W03a Windows measurements

# Measurements 1, 3, 4 and 7 from issue #57 ("Measure before W03a"), on
# hosted runners. Runs on a push to a measure/** branch; not part of CI.
# The core comes from a wheel built from EvoScientist main and installed by
# its scripts/install.ps1, as the core's installer smoke workflow does.
on:
  push:
    branches: ["measure/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: main
  UPDATE_VERSION: "0.3.7"

jobs:
  core-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: EvoScientist/EvoScientist
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build the wheel and export the constraints
        working-directory: core
        run: |
          uv build --wheel -o ../dist
          uv export --frozen --no-hashes --no-dev --no-emit-project --all-extras --no-header --no-annotate --quiet -o ../dist/constraints.txt
          cp scripts/install.ps1 ../dist/
          git rev-parse HEAD > ../dist/core-sha.txt
          cat ../dist/core-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/

  # Measurement 1: console windows of every descendant of an Electron main
  # process (setup, deploy, taskkill, update and its helper).
  consoles:
    needs: core-wheel
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: ${{ runner.temp }}/dist
      - name: Install Electron for the probe app
        working-directory: desktop-measure
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install the core (release, then the wheel from main), no setup
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\dist\install.ps1"
          & ([scriptblock]::Create((Get-Content -Raw $installer))) -NoSetup -NoModifyPath
          $env:EVOSCI_INSTALL_SOURCE = (Get-ChildItem "$env:RUNNER_TEMP\dist\*.whl").FullName
          $env:EVOSCI_INSTALL_CONSTRAINTS = "$env:RUNNER_TEMP\dist\constraints.txt"
          & ([scriptblock]::Create((Get-Content -Raw $installer))) -NoSetup -NoModifyPath
      - name: Measure
        shell: powershell
        run: |
          $electron = (& node -p "require('./desktop-measure/node_modules/electron')").Trim()
          $dataDir = Join-Path $env:USERPROFILE '.evoscientist'
          $uv = (Get-Content -Raw -Encoding UTF8 (Join-Path $dataDir 'tools\uv.json') | ConvertFrom-Json).path
          $env:EVOSCI = Join-Path ((& $uv tool dir --bin).Trim()) 'EvoSci.exe'
          $env:MEASURE_OUT = "$env:RUNNER_TEMP\measure-out"
          $env:WORKDIR = "$env:RUNNER_TEMP\workspace"
          # Only system folders on PATH, so setup downloads Node, uv's Python and Git.
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0\;$env:SystemRoot\System32\Wbem"
          Get-ChildItem Env: | Where-Object Name -match '^(UV_|PIP_|PYTHONPATH$)' | ForEach-Object { Remove-Item "Env:\$($_.Name)" }
          $p = Start-Process -FilePath $electron -ArgumentList "`"$env:GITHUB_WORKSPACE\desktop-measure`"", '--mode=consoles' -PassThru -Wait
          Write-Host "probe exit code: $($p.ExitCode)"
          Get-Content "$env:MEASURE_OUT\consoles.result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-1-consoles
          path: ${{ runner.temp }}/measure-out/

  # Measurement 3: a UI server left behind after the main process is killed.
  orphan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Electron for the probe app
        working-directory: desktop-measure
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Measure
        shell: powershell
        run: |
          $electron = (& node -p "require('./desktop-measure/node_modules/electron')").Trim()
          $env:MEASURE_OUT = "$env:RUNNER_TEMP\measure-out"
          foreach ($variant in 'running', 'suspended') {
            & "$env:GITHUB_WORKSPACE\desktop-measure\orphan_check.ps1" -Variant $variant -Electron $electron
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-3-orphan
          path: ${{ runner.temp }}/measure-out/

  # Measurement 4: EvoSci update --json with a cold uv cache, from a parent
  # that reads only stdout, and (control) one that reads both streams.
  backpressure:
    needs: core-wheel
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        read: [stdout, both]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: ${{ runner.temp }}/dist
      - name: Install Electron for the probe app
        working-directory: desktop-measure
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install the core (release, then the wheel from main)
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\dist\install.ps1"
          & ([scriptblock]::Create((Get-Content -Raw $installer))) -NoSetup -NoModifyPath
          $env:EVOSCI_INSTALL_SOURCE = (Get-ChildItem "$env:RUNNER_TEMP\dist\*.whl").FullName
          $env:EVOSCI_INSTALL_CONSTRAINTS = "$env:RUNNER_TEMP\dist\constraints.txt"
          & ([scriptblock]::Create((Get-Content -Raw $installer)))
      - name: Measure
        shell: powershell
        env:
          READ: ${{ matrix.read }}
        run: |
          $electron = (& node -p "require('./desktop-measure/node_modules/electron')").Trim()
          $dataDir = Join-Path $env:USERPROFILE '.evoscientist'
          $uv = (Get-Content -Raw -Encoding UTF8 (Join-Path $dataDir 'tools\uv.json') | ConvertFrom-Json).path
          $env:EVOSCI = Join-Path ((& $uv tool dir --bin).Trim()) 'EvoSci.exe'
          # A cold uv cache, so the reinstall prints all of uv's download output.
          & $uv cache clean
          $env:MEASURE_OUT = "$env:RUNNER_TEMP\measure-out"
          $env:WORKDIR = "$env:RUNNER_TEMP\workspace"
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0\;$env:SystemRoot\System32\Wbem"
          Get-ChildItem Env: | Where-Object Name -match '^(UV_|PIP_|PYTHONPATH$)' | ForEach-Object { Remove-Item "Env:\$($_.Name)" }
          $p = Start-Process -FilePath $electron -ArgumentList "`"$env:GITHUB_WORKSPACE\desktop-measure`"", '--mode=backpressure' -PassThru -Wait
          Write-Host "probe exit code: $($p.ExitCode)"
          Get-Content "$env:MEASURE_OUT\backpressure.result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-4-backpressure-${{ matrix.read }}
          path: ${{ runner.temp }}/measure-out/

  # Measurement 7: an x64 Node on Windows on Arm.
  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
      - name: Measure
        run: node desktop-measure/arm64_check.cjs
